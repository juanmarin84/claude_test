<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White House Miami — Recorrido 3D</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{--ink:#1d2228;--muted:#6b7480;--gold:#b88a2c;--panel:rgba(255,255,255,.88);--line:rgba(0,0,0,.08);
  --font:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--font)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit}

/* ---------- Inicio ---------- */
#inicio{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;
  transition:opacity .8s ease, visibility .8s}
#inicio.oculto{opacity:0;visibility:hidden}
#inicio img{width:min(560px,78vw);height:auto}
#btnInicio{min-width:150px;padding:13px 30px;border:0;border-radius:3px;background:#383d46;color:#fff;font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;
  transition:background .2s, opacity .3s}
#btnInicio:hover{background:#23272e}
#btnInicio:disabled{opacity:.55;cursor:progress}
#carga{font-size:12px;color:var(--muted);letter-spacing:.08em;height:14px;margin-top:-40px}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:10;pointer-events:none}
.hud *{pointer-events:auto}
#logo{top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));background:#fff;border-radius:3px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#logo img{height:42px;display:block}
#menu{top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start}
.btn{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:3px;color:var(--ink);
  padding:9px 16px;font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer;min-width:118px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);
  transition:background .15s,color .15s}
.btn:hover{background:#fff}
.btn.activo{background:#383d46;color:#fff;border-color:#383d46}
#pisos{display:flex;flex-direction:column;gap:6px}
#listaPisos{display:flex;flex-direction:column;gap:6px;overflow:hidden;max-height:0;transition:max-height .35s ease}
#listaPisos.abierto{max-height:220px}
#modo{left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;
  opacity:0;visibility:hidden;transition:opacity .4s, visibility .4s}
#modo.visible{opacity:1;visibility:visible}
#modo .btn{min-width:72px}
#ayuda{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);
  white-space:nowrap;transition:opacity .6s}
#fundido{position:fixed;inset:0;background:#fff;z-index:20;opacity:0;pointer-events:none;transition:opacity .35s ease}
#fundido.on{opacity:1}

/* ---------- Recorrido 360 ---------- */
#tour{position:fixed;inset:0;z-index:40;background:#fff;display:none}
#tour.abierto{display:block}
#tour iframe{border:0;width:100%;height:100%;display:block}
#cerrarTour{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:2}

@media (max-width:600px){
  #logo img{height:30px}
  .btn{min-width:92px;padding:8px 10px;font-size:12px}
  #ayuda{display:none}
}
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body>

<div id="inicio">
  <img src="assets/logo.png" alt="White House Miami">
  <button id="btnInicio" disabled>Inicio</button>
  <div id="carga">Cargando modelo… 0%</div>
</div>

<div id="logo" class="hud"><img src="assets/logo.png" alt="White House Miami"></div>

<div id="menu" class="hud">
  <button class="btn" id="btnTour">Recorrido 360</button>
  <div id="pisos">
    <button class="btn" id="btnPisos" aria-expanded="false">Pisos</button>
    <div id="listaPisos">
      <button class="btn" data-piso="1">Piso 1</button>
      <button class="btn" data-piso="2">Piso 2</button>
      <button class="btn" data-piso="3">Piso 3</button>
      <button class="btn" data-piso="0">Vista general</button>
    </div>
  </div>
</div>

<div id="modo" class="hud">
  <button class="btn" data-modo="2d">2D</button>
  <button class="btn activo" data-modo="3d">3D</button>
</div>

<div id="ayuda" class="hud">Arrastra para girar · rueda o pellizco para acercar · clic derecho para desplazar</div>
<div id="fundido"></div>

<div id="tour">
  <button class="btn" id="cerrarTour">Cerrar</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from './lib/jsm/controls/OrbitControls.js';
import { EffectComposer } from './lib/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './lib/jsm/postprocessing/RenderPass.js';
import { GTAOPass } from './lib/jsm/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from './lib/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './lib/jsm/postprocessing/OutputPass.js';

/* Coordenadas: el exportador glTF de Unreal convierte (X,Y,Z) cm -> (X, Z, Y) m. */
const ue = (x, y, z) => new THREE.Vector3(x / 100, z / 100, y / 100);

const TOUR_URL = 'https://panoraven.com/es/embed/EtcZ5QmwUT';
const PLANTA = { centro: ue(6, -642, 0), alto: 20.05 };                       // cámara ortográfica de Unreal (OrthoWidth 2005)
const PLANO = { centro: ue(-134.6, -541.6, 470), ancho: 41.384, alto: 29.917 }; // imagen P1 alineada con el modelo
const VISTA_GENERAL = { pos: new THREE.Vector3(60, 13, -48), target: ue(0, -900, 250) };
const CENTRO_SITIO = new THREE.Vector3(3, 0, -11);

/* Calidad: en celulares se apagan los efectos más costosos */
const MOVIL = (matchMedia('(pointer:coarse)').matches && !matchMedia('(hover:hover)').matches) || Math.min(screen.width, screen.height) < 600;
const calidad = new URLSearchParams(location.search).get('calidad') || (MOVIL ? 'media' : 'alta');
const ALTA = calidad === 'alta';

/* ---------- Render ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: !ALTA, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, ALTA ? 1.75 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HAZE = new THREE.Color().setRGB(0.66 * 2.1, 0.80 * 2.1, 0.98 * 2.1);
scene.fog = new THREE.Fog(HAZE, 260, 2600);

const persp = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 9000);
persp.position.copy(VISTA_GENERAL.pos);
const orto = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
orto.up.set(0, 0, -1);                       // arriba de la pantalla = -Y de Unreal, igual que la vista de planta
let camara = persp;

const controls = new OrbitControls(persp, renderer.domElement);
controls.target.copy(VISTA_GENERAL.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minDistance = 8;
controls.maxDistance = 160;
controls.update();

const reloj = new THREE.Clock();
const uTiempo = { value: 0 };

/* ---------- Sol y cielo físico ---------- */
const ELEVACION = 38, AZIMUT = 196;          // grados: tarde clara, sombras largas
const sol = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - ELEVACION), THREE.MathUtils.degToRad(AZIMUT));

/* Cielo: degradado atmosférico con halo y disco solar (valores HDR) */
const sky = new THREE.Mesh(new THREE.SphereGeometry(8000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSinSol: { value: 0 }, uSol: { value: sol }, uCenit: { value: new THREE.Color().setRGB(0.035, 0.15, 0.58) }, uHorizonte: { value: new THREE.Color().setRGB(0.66, 0.80, 0.98) } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vDir = w.xyz - cameraPosition; gl_Position = projectionMatrix * viewMatrix * w; gl_Position.z = gl_Position.w; }`,
  fragmentShader: /* glsl */`
    uniform vec3 uSol, uCenit, uHorizonte; uniform float uSinSol; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float y = max(d.y, 0.);
      vec3 c = mix(uHorizonte*2.2, uCenit*2.3, pow(y, 0.3));
      float mu = max(dot(d, uSol), 0.);
      vec3 sc = vec3(1.0, 0.92, 0.78);
      c += sc * (pow(mu, 8.)*0.55 + (1.-uSinSol)*(pow(mu, 64.)*1.2 + pow(mu, 900.)*20. + smoothstep(0.99985, 0.99993, mu) * 120.));
      c = mix(c, uHorizonte*2.2, smoothstep(0.0, -0.08, d.y));
      gl_FragColor = vec4(c, 1.);
    }`
}));
sky.frustumCulled = false;
scene.add(sky);

/* ---------- Nubes: capa volumétrica procedimental (raymarch corto sobre un plano a 1.4 km) ---------- */
const nubes = new THREE.Mesh(new THREE.SphereGeometry(7000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, depthWrite: false, fog: false,
  uniforms: { uTiempo, uSol: { value: sol }, uHaze: { value: HAZE }, uCobertura: { value: 0.68 }, uBrillo: { value: 3.4 } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vDir = w.xyz - cameraPosition; gl_Position = projectionMatrix * viewMatrix * w; gl_Position.z = gl_Position.w; }`,
  fragmentShader: /* glsl */`
    uniform float uTiempo; uniform vec3 uSol; uniform vec3 uHaze; uniform float uCobertura; uniform float uBrillo;
    varying vec3 vDir;
    float h(vec3 p){ p = fract(p*0.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
    float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
    float dens(vec3 p){
      vec3 q = p*0.0011 + vec3(uTiempo*0.006, 0., uTiempo*0.004);
      float base = fbm(q*vec3(1.,1.6,1.));
      float det = fbm(q*3.7 + base);
      float d = base*0.85 + det*0.3 - uCobertura;
      float alt = clamp((p.y-1400.)/700., 0., 1.);
      return smoothstep(0.0, 0.16, d) * smoothstep(0.,.25,alt) * smoothstep(1.,.55,alt);
    }
    void main(){
      vec3 d = normalize(vDir);
      if (d.y < 0.012) discard;
      float t0 = 1400./d.y, t1 = 2100./d.y;
      float dist = t0;
      if (dist > 60000.) discard;
      vec3 o = vec3(cameraPosition.x, 0., cameraPosition.z);
      const int N = 10;
      float stp = (t1-t0)/float(N);
      float jit = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
      float T = 1.; vec3 L = vec3(0.);
      vec3 sunCol = vec3(1.0,0.96,0.9)*uBrillo, ambTop = vec3(0.72,0.82,0.98)*uBrillo*0.55, ambBot = vec3(0.50,0.56,0.66)*uBrillo*0.5;
      for (int i=0;i<N;i++){
        vec3 p = o + d*(t0 + stp*(float(i)+jit));
        float de = dens(p);
        if (de < .01) continue;
        float ds = dens(p + uSol*160.);
        float luz = exp(-ds*2.2);
        float alt = clamp((p.y-1400.)/700.,0.,1.);
        vec3 c = sunCol*luz*(0.55+0.45*pow(max(dot(d,uSol),0.),6.)) + mix(ambBot, ambTop, alt)*0.55;
        float a = 1. - exp(-de*stp*0.0042);
        L += T*a*c; T *= 1.-a;
        if (T < .03) break;
      }
      float alpha = 1.-T;
      float far = smoothstep(.02,.32,d.y);
      vec3 col = mix(uHaze*1.1, L/max(alpha,1e-3), far*0.7+0.3);
      gl_FragColor = vec4(col, alpha*far*0.95);
    }`
}));
nubes.renderOrder = -1;
nubes.frustumCulled = false;
scene.add(nubes);

/* Entorno (reflejos) a partir del cielo */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); const skyEnv = sky.clone(); skyEnv.material = sky.material.clone(); skyEnv.material.uniforms.uSinSol.value = 1; skyEnv.material.uniforms.uSol.value = sol; envScene.add(skyEnv);

scene.environment = pmrem.fromScene(envScene, 0, 0.1, 9000).texture;

const luzSol = new THREE.DirectionalLight(0xfff3e2, 7.4);
luzSol.position.copy(sol).multiplyScalar(80).add(CENTRO_SITIO);
luzSol.target.position.copy(CENTRO_SITIO);
luzSol.castShadow = true;
luzSol.shadow.mapSize.set(ALTA ? 4096 : 2048, ALTA ? 4096 : 2048);
luzSol.shadow.bias = -0.0003;
luzSol.shadow.normalBias = 0.03;
Object.assign(luzSol.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 });
scene.add(luzSol, luzSol.target);

/* ---------- Mar poco profundo: superficie transparente + fondo de arena con cáusticas ---------- */
const texLoader = new THREE.TextureLoader();
const normalesAgua = texLoader.load('assets/tex/waternormals.webp');
normalesAgua.wrapS = normalesAgua.wrapT = THREE.RepeatWrapping;

const GLSL_RUIDO = /* glsl */`
  float hR(vec3 p){ p = fract(p*0.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
    return mix(mix(mix(hR(i),hR(i+vec3(1,0,0)),f.x),mix(hR(i+vec3(0,1,0)),hR(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hR(i+vec3(0,0,1)),hR(i+vec3(1,0,1)),f.x),mix(hR(i+vec3(0,1,1)),hR(i+vec3(1,1,1)),f.x),f.y),f.z); }`;

/* Viento: el tronco se inclina con la altura y las hojas ondean más hacia las puntas */
const GLSL_VIENTO = /* glsl */`
  void viento(inout vec3 p, float hoja){
    vec3 base = vec3(modelMatrix[3].x, modelMatrix[3].y, modelMatrix[3].z);
    float ph = dot(base.xz, vec2(0.37, 0.21));
    vec2 dir = normalize(vec2(1.0, 0.45));
    float k = pow(max(p.y, 0.) / 9.5, 2.);
    float rafaga = 0.6 + 0.4*sin(uTiempo*0.23 + ph*0.5);
    float s = (sin(uTiempo*0.95 + ph)*0.65 + sin(uTiempo*1.9 + ph*1.7)*0.25) * rafaga;
    p.xz += dir * (0.12 + 0.16*s) * k;
    if (hoja > 0.5){
      float r = length(p.xz);
      float fl = sin(uTiempo*3.3 + ph*2.0 + r*1.6 + p.x*0.8) * 0.055 * r * rafaga;
      p.y += fl;
      p.xz += dir * 0.035 * r * sin(uTiempo*2.4 + ph + r*1.3) * rafaga;
    }
  }`;

const GLSL_CIELO = /* glsl */`
  uniform vec3 uSol, uCenit, uHorizonte;
  vec3 colorCielo(vec3 d){
    float y = max(d.y, 0.);
    vec3 c = mix(uHorizonte*2.2, uCenit*2.3, pow(y, 0.3));
    float mu = max(dot(d, uSol), 0.);
    vec3 sc = vec3(1.0, 0.92, 0.78);
    c += sc * pow(mu, 8.)*0.55;
    return c; }`;

/* Dos pasadas: (1) multiplica lo que hay debajo por la transmitancia del agua, (2) suma reflejo y color propio */
function materialesAgua({ fondoFijo = -999, absorcion, dispersion, escalas, fuerza }) {
  const uniforms = {
    uTiempo, tNorm: { value: normalesAgua }, uSol: { value: sol },
    uCenit: sky.material.uniforms.uCenit, uHorizonte: sky.material.uniforms.uHorizonte,
    uHaze: { value: HAZE }, uNiebla: { value: new THREE.Vector2(scene.fog.near, scene.fog.far) },
    uPoli, uFondoFijo: { value: fondoFijo },
    uAbs: { value: new THREE.Vector3(...absorcion) }, uDisp: { value: new THREE.Vector3(...dispersion) },
    uEsc: { value: new THREE.Vector2(...escalas) }, uFuerza: { value: fuerza }
  };
  const vertexShader = GLSL_FONDO + /* glsl */`
    uniform float uFondoFijo;
    varying vec3 vWPos; varying float vFondo;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vWPos = w.xyz;
      vFondo = uFondoFijo > -900. ? uFondoFijo : fondoMar(w.xz);
      gl_Position = projectionMatrix * viewMatrix * w; }`;
  const comun = GLSL_CIELO + /* glsl */`
    uniform float uTiempo, uFondoFijo, uFuerza; uniform sampler2D tNorm; uniform vec3 uHaze, uAbs, uDisp; uniform vec2 uNiebla, uEsc;
    varying vec3 vWPos; varying float vFondo;
    void agua(out vec3 trans, out vec3 suma){
      vec3 wp = vWPos; float dist = length(cameraPosition - wp);
      vec2 n1 = texture2D(tNorm, wp.xz/uEsc.x + uTiempo*vec2(0.031, 0.019)).xy*2.-1.;
      vec2 n2 = texture2D(tNorm, wp.xz/uEsc.y + uTiempo*vec2(-0.017, 0.027)).xy*2.-1.;
      vec2 dn = (n1 + n2) * uFuerza / (1. + dist*0.012);
      vec3 N = normalize(vec3(dn.x, 1., dn.y));
      vec3 V = normalize(cameraPosition - wp);
      float cosT = max(dot(N, V), 0.);
      float fres = 0.02 + 0.98*pow(1. - cosT, 5.);
      vec3 R = reflect(-V, N); R.y = abs(R.y);
      vec3 refl = colorCielo(R);
      float mu = max(dot(R, uSol), 0.);
      refl += vec3(1.0,0.93,0.8) * (pow(mu, 1400.)*90. + pow(mu, 160.)*2.5);
      vec3 T = refract(-V, N, 0.75);
      float fondo = vFondo;
      float L = max(wp.y - fondo, 0.02) / max(-T.y, 0.12);
      vec3 tr = exp(-uAbs * L);
      vec3 luzAmb = uHorizonte*2.0;
      vec3 disp = uDisp * luzAmb * (1. - tr);
      trans = tr * (1. - fres);
      suma = disp * (1. - fres) + refl * fres;
      float nb = smoothstep(uNiebla.x, uNiebla.y, dist);
      trans = mix(trans, vec3(0.), nb);
      suma = mix(suma, uHaze, nb);
    }`;
  const mult = new THREE.ShaderMaterial({
    uniforms, vertexShader, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.ZeroFactor, blendDst: THREE.SrcColorFactor,
    fragmentShader: comun + 'void main(){ vec3 t, s; agua(t, s); gl_FragColor = vec4(t, 1.); }'
  });
  const add = new THREE.ShaderMaterial({
    uniforms, vertexShader, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    fragmentShader: comun + 'void main(){ vec3 t, s; agua(t, s); gl_FragColor = vec4(s, 1.); }'
  });
  return [mult, add];
}

/* Fondo marino: arena con ondas, manchas de algas/roca y cáusticas solo donde da el sol */
let fondoMarino = null, baseIsla = null;
function crearMar(texArena) {
  const geo = new THREE.PlaneGeometry(3000, 3000, 240, 240); geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({ name: 'FondoMarino', color: 0xcfc6b2, roughness: 1 });
  conMundo(mat, { c: texArena[0], n: texArena[1], r: texArena[2], escala: 4, macro: 0.5, normal: 0.6,
    verticeAntes: GLSL_FONDO, uniformes: { uPoli },
    vertice: 'transformed.y = fondoMar(transformed.xz);',
    normalVert: 'objectNormal = normalize(vec3(fondoMar(position.xz - vec2(1.,0.)) - fondoMar(position.xz + vec2(1.,0.)), 2., fondoMar(position.xz - vec2(0.,1.)) - fondoMar(position.xz + vec2(0.,1.))));',
    antes: GLSL_CAUSTICAS + GLSL_RUIDO,
    extra: `
      float alga = smoothstep(0.58, 0.72, vnoise(vec3(vWPos.xz*0.09, 1.)) * 0.7 + vnoise(vec3(vWPos.xz*0.31, 2.)) * 0.3);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16, 0.17, 0.10), alga*0.85);`,
    luz: `{ float dCam = length(cameraPosition - vWPos);
      float k = smoothstep(60., 12., dCam) * smoothstep(-12., -3., vWPos.y);
      if (k > 0.01) reflectedLight.directDiffuse *= 1. + 1.8*k*causticas(vWPos.xz/0.85, uTiempo*1.1); }` });
  fondoMarino = new THREE.Mesh(geo, mat);
  fondoMarino.receiveShadow = true;
  fondoMarino.frustumCulled = false;
  scene.add(fondoMarino);

  // base de la isla: muro bajo el agua para que no quede flotando
  const pos = [], arriba = -0.93, abajo = -10;
  CONTORNO.forEach(([x1, z1], i) => {

/* ---------- Materiales con proyección en coordenadas de mundo (sin repetición visible) ---------- */
const anis = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const tex = (n, srgb) => {
  const t = texLoader.load(`assets/tex/${n}.webp`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = anis;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
};
const texMacro = tex('macro', false);
const T_CONCRETO = [tex('concreto_c', true), tex('concreto_n'), tex('concreto_r')];

const GLSL_COMUN = /* glsl */`
  varying vec3 vWPos; varying vec3 vWNor; varying vec3 vLoc;
  uniform float uTiempo;
  vec3 pesosTri(){ vec3 w = pow(abs(normalize(vWNor)), vec3(4.)); return w/(w.x+w.y+w.z); }
  vec4 tri(sampler2D t, float esc){ vec3 w = pesosTri();
    return texture2D(t, vWPos.xz/esc)*w.y + texture2D(t, vWPos.zy/esc)*w.x + texture2D(t, vWPos.xy/esc)*w.z; }
  vec4 triAnti(sampler2D t, float esc, float mezcla){
    vec4 a = tri(t, esc);
    vec2 r = mat2(0.8,-0.6,0.6,0.8) * vWPos.xz / (esc*2.71);
    vec4 b = texture2D(t, r);
    return mix(a, b, mezcla*pesosTri().y);
  }`;

function conMundo(mat, opciones) {
  const { c, n, r, escala = 2, macro = 0.25, normal = 1, rugosidad = 1, extra = '', antes = '', conservar = false, vertice = '', verticeAntes = '', normalVert = '', luz = '', uniformes = {} } = opciones;
  if (!conservar) { mat.map = null; mat.normalMap = null; mat.roughnessMap = null; mat.metalnessMap = null; }
  mat.aoMap = null;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uTiempo, tMacro: { value: texMacro }, uEsc: { value: escala }, uMacro: { value: macro }, uNorm: { value: normal }, uRug: { value: rugosidad } });
    if (c) sh.uniforms.tC = { value: c };
    if (n) sh.uniforms.tN = { value: n };
    if (r) sh.uniforms.tR = { value: r };
    Object.assign(sh.uniforms, uniformes);
    let v = 'varying vec3 vWPos; varying vec3 vWNor; varying vec3 vLoc; uniform float uTiempo;\n' + verticeAntes + '\n' + sh.vertexShader;
    if (normalVert) v = v.replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n' + normalVert);
    v = v.replace('#include <begin_vertex>', '#include <begin_vertex>\n vLoc = position;\n' + vertice);
    sh.vertexShader = v.replace('#include <project_vertex>',
      '#include <project_vertex>\n vWPos = (modelMatrix * vec4(transformed,1.)).xyz; vWNor = normalize(mat3(modelMatrix) * objectNormal);');
    let f = GLSL_COMUN + `\nuniform sampler2D tMacro; uniform float uEsc, uMacro, uNorm, uRug;\n${c ? 'uniform sampler2D tC;' : ''}${n ? 'uniform sampler2D tN;' : ''}${r ? 'uniform sampler2D tR;' : ''}\n${antes}\n` + sh.fragmentShader;
    f = f.replace('#include <map_fragment>', `${conservar ? '#include <map_fragment>' : ''}
      vec3 mac = texture2D(tMacro, vWPos.xz/60.).rgb;
      ${c ? 'vec4 colT = triAnti(tC, uEsc, smoothstep(.35,.65,mac.b)); diffuseColor.rgb *= colT.rgb;' : ''}
      diffuseColor.rgb *= mix(1., 0.78 + 0.44*mac.r, uMacro);
      ${extra}`);
    if (luz) f = f.replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\n' + luz);
    if (r) f = f.replace('#include <roughnessmap_fragment>', 'float roughnessFactor = clamp(roughness * tri(tR, uEsc).g * uRug, 0.02, 1.);');
    if (n) f = f.replace('#include <normal_fragment_maps>', `{
      vec3 w = pesosTri();
      vec3 a = texture2D(tN, vWPos.xz/uEsc).xyz*2.-1., b = texture2D(tN, vWPos.zy/uEsc).xyz*2.-1., d = texture2D(tN, vWPos.xy/uEsc).xyz*2.-1.;
      vec3 nw = normalize(vWNor);
      vec3 pert = w.y*vec3(a.x, 0., -a.y) + w.x*vec3(0., b.y, b.x) + w.z*vec3(d.x, d.y, 0.);
      nw = normalize(nw + pert*uNorm);
      normal = normalize((viewMatrix * vec4(nw, 0.)).xyz);
    }`);
    sh.fragmentShader = f;
  };
  mat.customProgramCacheKey = () => 'mundo_' + mat.name;
  mat.needsUpdate = true;
}

const GLSL_CAUSTICAS = /* glsl */`
  vec2 hC(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
  float vorC(vec2 p, float t){
    vec2 i = floor(p), f = fract(p); float d1 = 8., d2 = 8.;
    for (int y=-1; y<=1; y++) for (int x=-1; x<=1; x++){
      vec2 g = vec2(float(x), float(y)); vec2 o = hC(i+g); o = 0.5 + 0.42*sin(t + 6.2831*o);
      vec2 r = g + o - f; float d = dot(r,r);
      if (d < d1){ d2 = d1; d1 = d; } else if (d < d2) d2 = d; }
    return sqrt(d2) - sqrt(d1); }
  float causticas(vec2 p, float t){
    vec2 w = p + 0.32*vec2(sin(p.y*0.9 + t*0.7), cos(p.x*0.8 - t*0.6));
    float e1 = vorC(w, t*0.9), e2 = vorC(w*1.43 + 3.1, t*1.15 + 1.);
    return pow(1. - smoothstep(0., 0.2, e1), 2.5) + 0.55*pow(1. - smoothstep(0., 0.16, e2), 2.5); }`;

/* Contorno de la isla (x, z) y profundidad del fondo marino */
const CONTORNO = [[-27.85, -3.05], [-27.35, -2.45], [-27.35, -1.6], [-25.0, 2.65], [-24.85, 4.4], [20.45, 4.4], [20.85, 4.65], [21.95, 4.45], [22.55, 4.8], [33.15, -13.75], [-4.4, -27.45], [-4.85, -26.35], [-5.8, -26.3], [-6.1, -24.6]];
const NIVEL_MAR = -1.35;
const GLSL_FONDO = /* glsl */`
  uniform vec2 uPoli[14];
  float distIsla(vec2 p){
    float d = dot(p-uPoli[0], p-uPoli[0]); float s = 1.;
    for (int i=0, j=13; i<14; j=i, i++){
      vec2 e = uPoli[j]-uPoli[i]; vec2 w = p-uPoli[i];
      vec2 b = w - e*clamp(dot(w,e)/dot(e,e), 0., 1.); d = min(d, dot(b,b));
      bvec3 c = bvec3(p.y>=uPoli[i].y, p.y<uPoli[j].y, e.x*w.y>e.y*w.x);
      if (all(c) || all(not(c))) s *= -1.; }
    return s*sqrt(d); }
  float fondoMar(vec2 p){
    float d = max(distIsla(p), 0.);
    float y = -2.9 - 0.9*smoothstep(2., 16., d) - 6.0*smoothstep(18., 130., d) - 22.*smoothstep(120., 700., d);
    return y + 0.35*sin(p.x*0.05 + sin(p.y*0.04)*2.)*smoothstep(8., 40., d); }`;
const uPoli = { value: CONTORNO.map(([x, z]) => new THREE.Vector2(x, z)) };

function mejorarMateriales(modelo) {
  const T = {
    pasto: [tex('pasto_c', true), tex('pasto_n'), tex('pasto_r')],
    grava: [tex('grava_c', true), tex('grava_n'), tex('grava_r')],
    concreto: [tex('concreto_c', true), tex('concreto_n'), tex('concreto_r')],
    adoquin: [tex('adoquin_c', true), tex('adoquin_n'), tex('adoquin_r')],
    travertino: [tex('travertino_c', true), tex('travertino_n'), tex('travertino_r')],
    deck: [tex('deck_c', true), tex('deck_n'), tex('deck_r')],
  };
  const estuco = tex('estuco');
  const hechos = new Map();
  const aguaMats = [];
  let matMuelle = null;

  modelo.traverse((o) => {
    if (!o.isMesh) return;
    let m = o.material;
    const nombreNodo = (o.parent && o.parent.name) + '|' + o.name;
    // el muelle comparte MI_Blanco: le damos concreto propio
    if (/Ext_Muelle/.test(nombreNodo)) {
      if (!matMuelle) {
        matMuelle = new THREE.MeshStandardMaterial({ name: 'Muelle_Concreto', color: 0xd6d3cc, roughness: 0.9 });
        conMundo(matMuelle, { c: T.concreto[0], n: T.concreto[1], r: T.concreto[2], escala: 3, macro: 0.35, normal: 0.5 });
      }
      o.material = matMuelle; return;
    }
    if (hechos.has(m)) return; hechos.set(m, true);
    const nm = m.name || '';
    const setC = (hex) => { m.color.set(hex); };
    switch (true) {
      case nm === 'MI_Pasto':
        setC(0xffffff); m.roughness = 1; m.metalness = 0;
        conMundo(m, { c: T.pasto[0], n: T.pasto[1], r: T.pasto[2], escala: 2.6, macro: 0.45, normal: 0.9 }); break;
      case nm === 'MI_Piedra':
        setC(0xf2f0ec); m.roughness = 1; m.metalness = 0;
        conMundo(m, { c: T.grava[0], n: T.grava[1], r: T.grava[2], escala: 1.6, macro: 0.3, normal: 0.8 }); break;
      case nm === 'MI_Ext_Pavimento':
        setC(0xe4e1da); m.roughness = 1;
        conMundo(m, { c: T.concreto[0], n: T.concreto[1], r: T.concreto[2], escala: 3.2, macro: 0.35, normal: 0.5 }); break;
      case nm === 'MI_Adoquin':
        setC(0xffffff); m.roughness = 1; m.metalness = 0;
        conMundo(m, { c: T.adoquin[0], n: T.adoquin[1], r: T.adoquin[2], escala: 1.6, macro: 0.25, normal: 0.8 }); break;
      case nm === 'MI_Borde_Piscina':
        setC(0xffffff); m.roughness = 1; m.metalness = 0;
        conMundo(m, { c: T.travertino[0], n: T.travertino[1], r: T.travertino[2], escala: 2.4, macro: 0.15, normal: 0.6,
          antes: GLSL_CAUSTICAS,
          extra: 'diffuseColor.rgb *= mix(vec3(0.72, 0.9, 0.94), vec3(1.), smoothstep(-0.42, -0.3, vWPos.y));',
          luz: 'if (vWPos.y < -0.35) reflectedLight.directDiffuse *= 1. + 2.4*causticas(vWPos.xz/0.7, uTiempo*1.25);' }); break;
      case nm === 'MI_Foso_Social':
        setC(0xffffff); m.roughness = 1; m.metalness = 0;
        conMundo(m, { c: T.deck[0], n: T.deck[1], r: T.deck[2], escala: 2.0, macro: 0.15, normal: 0.7 }); break;
      case nm === 'MI_Blanco':
        setC(0xd9d5cc); m.roughness = 0.82; m.metalness = 0;
        conMundo(m, { escala: 3, macro: 0, antes: 'uniform sampler2D tEst;',
          extra: 'diffuseColor.rgb *= 0.95 + 0.07*tri(tEst, 3.).r;' });
        { const ob = m.onBeforeCompile; m.onBeforeCompile = (sh) => { ob(sh); sh.uniforms.tEst = { value: estuco }; }; }
        break;
      case nm === 'MI_Ext_Fondo_Piscina':
      case nm === 'MI_Jacuzzi_Mosaico':
        if (nm === 'MI_Ext_Fondo_Piscina') setC(0x8fd6e0);
        conMundo(m, { macro: 0, antes: GLSL_CAUSTICAS, conservar: nm === 'MI_Jacuzzi_Mosaico',
          luz: `if (vWPos.y < ${nm === 'MI_Ext_Fondo_Piscina' ? '-0.3' : '0.25'}) reflectedLight.directDiffuse *= 1. + 2.4*causticas(vWPos.xz/0.7, uTiempo*1.25);` });
        break;
      case nm.startsWith('MI_Agua_'): {
        const piscina = nm === 'MI_Agua_Piscina';
        const [mult, add] = materialesAgua({
          fondoFijo: piscina ? -1.73 : -0.76, absorcion: [0.3, 0.07, 0.055], dispersion: [0.01, 0.12, 0.16],
          escalas: [0.9, 2.3], fuerza: 0.22 });
        o.material = mult; o.renderOrder = 2;
        const capa = new THREE.Mesh(o.geometry, add); capa.renderOrder = 3;
        o.add(capa);
        hechos.set(mult, true);
        break;
      }
      case nm.includes('Vidrio'):
        o.material = m = new THREE.MeshPhysicalMaterial({
          name: nm, color: 0x34474f, roughness: 0.03, metalness: 0.1, transparent: true, opacity: 0.62,
          envMapIntensity: 0.85, specularIntensity: 1, ior: 1.52, depthWrite: false });
        hechos.set(m, true);
        break;
      case nm === 'MI_Metal_Negro':
        setC(0x0d0e10); m.metalness = 0.7; m.roughness = 0.38; break;
      case nm === 'MI_Mob_Acero':
        m.metalness = 1; m.roughness = 0.28; setC(0xb9bcc0); break;
      case nm === 'MI_Puerta_Garaje':
        m.metalness = 0.5; m.roughness = 0.4; break;
      case nm.startsWith('MI_Hoja_'):
      case nm === 'MI_Tronco': {
        const hoja = nm !== 'MI_Tronco';
        if (hoja) { m.color.setRGB(0.92, 1.0, 0.82); m.roughness = 0.55; m.side = THREE.DoubleSide; }
        else { setC(0x8a7a66); m.roughness = 0.95; }
        conMundo(m, { macro: 0, conservar: true, verticeAntes: GLSL_VIENTO, vertice: `viento(transformed, ${hoja ? '1.' : '0.'});`,
          antes: GLSL_RUIDO + 'uniform vec3 uSolDir;',
          uniformes: { uSolDir: { value: sol } },
          extra: hoja ? `
            float rr = length(vLoc.xz);
            float nn = vnoise(vLoc*1.7 + floor(vWPos.xzx*0.08)*7.13);
            diffuseColor.rgb *= 0.7 + 0.5*nn;
            diffuseColor.rgb *= mix(0.55, 1.0, smoothstep(0.2, 1.4, rr));
            diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb*vec3(1.35,1.15,0.45), smoothstep(1.7, 2.9, rr)*0.55);` : `
            diffuseColor.rgb *= 0.85 + 0.3*vnoise(vec3(vLoc.y*6.0, vLoc.x*3., 0.));`,
          luz: hoja ? `{ vec3 Vd = normalize(cameraPosition - vWPos);
            float tr = pow(max(dot(-Vd, uSolDir), 0.), 3.);
            reflectedLight.indirectDiffuse += diffuseColor.rgb * vec3(1.0,0.95,0.6) * (0.35 + 2.2*tr) * 0.5; }` : '' });
        if (hoja) m.envMapIntensity = 0.5;
        break;
      }
      case nm === 'MI_Ext_Fuego':
        m.emissive.set(0xff6a1a); m.emissiveIntensity = 3; break;
    }
  });
  return aguaMats;
}

const materialesProfundidadViento = new Map();
function profundidadViento(hoja) {
  if (materialesProfundidadViento.has(hoja)) return materialesProfundidadViento.get(hoja);
  const d = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: THREE.DoubleSide });
  d.onBeforeCompile = (sh) => { sh.uniforms.uTiempo = uTiempo; sh.vertexShader = 'uniform float uTiempo;\n' + GLSL_VIENTO + '\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n viento(transformed, ${hoja ? '1.' : '0.'});`); };
  d.customProgramCacheKey = () => 'vientoProf' + hoja;
  materialesProfundidadViento.set(hoja, d);
  return d;
}

const espera = (ms) => new Promise((r) => setTimeout(r, ms));
function tween(dur, fn) {
  return new Promise((res) => {
    const t0 = performance.now();
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      fn(e); if (k < 1) requestAnimationFrame(paso); else res();
    };
    requestAnimationFrame(paso);
  });
}

async function irAPiso(n) {
  if (animando || n === pisoActual) return;
  animando = true;
  plano.visible = false; panelModo.classList.remove('visible');

  if (n > 0) {
    if (camara === persp) {
      // Vuelo hasta encima de la casa con la cámara perspectiva
      const p0 = persp.position.clone(), t0 = controls.target.clone();
      const altura = PLANTA.alto / 2 / Math.tan(THREE.MathUtils.degToRad(persp.fov / 2));
      const p1 = PLANTA.centro.clone().add(new THREE.Vector3(0, altura + 4, 0.01));
      controls.enabled = false;
      await tween(1400, (e) => { persp.position.lerpVectors(p0, p1, e); controls.target.lerpVectors(t0, PLANTA.centro, e); persp.lookAt(controls.target); });
    }
    fundido.classList.add('on'); await espera(350);
    aplicarPiso(n);
    ajustarOrto();
    orto.position.copy(PLANTA.centro).add(new THREE.Vector3(0, 60, 0));
    orto.lookAt(PLANTA.centro);
    camara = orto; usarCamaraEnPasadas(orto);
    controls.object = orto;
    controls.target.copy(PLANTA.centro);
    controls.enableRotate = false;
    controls.screenSpacePanning = true;
    controls.minZoom = 0.8; controls.maxZoom = 6;
    controls.enabled = true; controls.update();
    if (n === 1) { usarModo('3d'); plano.visible = true; panelModo.classList.add('visible'); }
    fundido.classList.remove('on');
  } else {
    fundido.classList.add('on'); await espera(350);
    aplicarPiso(0);
    camara = persp; usarCamaraEnPasadas(persp); controls.object = persp; controls.enableRotate = true;
    const altura = PLANTA.alto / 2 / Math.tan(THREE.MathUtils.degToRad(persp.fov / 2));
    persp.position.copy(PLANTA.centro).add(new THREE.Vector3(0, altura + 4, 0.01));
    controls.target.copy(PLANTA.centro); persp.lookAt(PLANTA.centro);
    fundido.classList.remove('on');
    controls.enabled = false;
    const p0 = persp.position.clone(), t0 = controls.target.clone();
    await tween(1600, (e) => { persp.position.lerpVectors(p0, VISTA_GENERAL.pos, e); controls.target.lerpVectors(t0, VISTA_GENERAL.target, e); persp.lookAt(controls.target); });
    controls.enabled = true; controls.update();
  }
  pisoActual = n;
  document.querySelectorAll('[data-piso]').forEach((b) => b.classList.toggle('activo', +b.dataset.piso === n && n > 0));
  animando = false;
}

function usarModo(m) {
  matPlano.map = m === '2d' ? tex2D : tex3D;
  matPlano.needsUpdate = true;
  document.querySelectorAll('[data-modo]').forEach((b) => b.classList.toggle('activo', b.dataset.modo === m));
}

/* ---------- Interfaz ---------- */
document.getElementById('btnInicio').addEventListener('click', () => {
  document.getElementById('inicio').classList.add('oculto');
  setTimeout(() => (ayuda.style.opacity = 0), 7000);
});
const lista = document.getElementById('listaPisos');
document.getElementById('btnPisos').addEventListener('click', (e) => {
  const abierto = lista.classList.toggle('abierto');
  e.currentTarget.setAttribute('aria-expanded', abierto);
});
document.querySelectorAll('[data-piso]').forEach((b) => b.addEventListener('click', () => irAPiso(+b.dataset.piso)));
document.querySelectorAll('[data-modo]').forEach((b) => b.addEventListener('click', () => usarModo(b.dataset.modo)));

const tour = document.getElementById('tour');
document.getElementById('btnTour').addEventListener('click', () => {
  if (!tour.querySelector('iframe')) {
    const f = document.createElement('iframe');
    f.src = TOUR_URL; f.allow = 'accelerometer; magnetometer; gyroscope; xr-spatial-tracking; fullscreen'; f.allowFullscreen = true;
    tour.appendChild(f);
  }
  tour.classList.add('abierto');
});
document.getElementById('cerrarTour').addEventListener('click', () => tour.classList.remove('abierto'));

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  persp.aspect = innerWidth / innerHeight; persp.updateProjectionMatrix();
  if (camara === orto) ajustarOrto();
});

window.__dbg = { scene, renderer, luzSol, composer, nubes, sky, persp, THREE, controls };
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.1);
  uTiempo.value += dt;
  nubes.position.copy(camara.position); sky.position.copy(camara.position);
  if (controls.enabled) controls.update();
  composer.render(dt);
});
</script>
</body>
</html>
